# Bangun installer Windows lalu terbitkan rilisnya, tanpa perlu mesin Windows.
#
# Alasan workflow ini ada: satu-satunya target build proyek ini adalah installer
# NSIS Windows, dan tiga bagian rantainya memang cuma jalan di Windows -
# electron/fetch-python.js berhenti sendiri kalau process.platform bukan win32,
# pembongkaran zip-nya memakai PowerShell Expand-Archive, dan penyematan ikon
# memanggil rcedit-x64.exe. Di macOS/Linux ketiganya gugur, dan yang keluar
# adalah installer tanpa Python maupun OR-Tools. Runner windows-latest
# menjalankan rantai yang SAMA PERSIS dengan yang dijalankan di mesin Windows,
# jadi tidak ada satu baris pun kode build yang perlu diubah demi CI.
#
# Dipicu manual, bukan otomatis tiap push: rilis mengunggah installer ~186 MB ke
# repo publik padelin-rilis dan langsung terlihat oleh setiap aplikasi terpasang
# (electron-updater memeriksanya sendiri). Itu keputusan host, bukan akibat
# sampingan dari sebuah commit.
#
# Sekali saja sebelum dipakai: tambahkan secret repo bernama GH_TOKEN, isinya
# token dengan izin TULIS ke satriapribadi/padelin-rilis saja. Token itu tidak
# pernah masuk ke installer maupun ke kode - ia cuma dipakai runner saat
# membuat tag dan mengunggah.

name: Rilis

on:
  workflow_dispatch:
    inputs:
      terbitkan:
        description: >-
          Terbitkan rilisnya. Matikan untuk uji-kering: seluruh rantai dijalankan
          sampai installer jadi, tanpa membuat tag, rilis, atau mengunggah apa pun.
        type: boolean
        default: true

# Izin bawaan dipersempit: workflow ini tidak menulis apa pun ke repo kode.
# Yang menulis ke repo rilis adalah GH_TOKEN, bukan token bawaan Actions.
permissions:
  contents: read

# Dua rilis yang berjalan bersamaan akan berebut tag dan aset yang sama.
concurrency:
  group: rilis
  cancel-in-progress: false

jobs:
  # Tes dijadikan job tersendiri yang MENGGERBANGI rilis, bukan langkah di
  # dalamnya. Dua alasan: kegagalannya terbaca sebagai "tes gagal" alih-alih
  # tenggelam di log build 200 MB, dan job ini tidak perlu menunggu apa pun -
  # ia mulai bersamaan, jadi yang ditambahkan ke rilis cuma selisih waktunya.
  #
  # Yang dijaga: jangan sampai kode yang tesnya merah ikut terbit ke setiap
  # aplikasi terpasang. Rilis di sini langsung terlihat oleh electron-updater,
  # jadi tidak ada jeda untuk menariknya kembali.
  tes:
    runs-on: windows-latest
    # 45, bukan 30: suite penjadwalan sendiri memakan 22-28 menit di runner
    # windows-latest (22,1 -> 23,0 -> 27,1 pada tiga rilis terakhir, lalu 28,7
    # dan kena batas pada v1.5.1). Batas 30 sudah tidak menyisakan ruang, dan
    # yang dibunuhnya bukan tes merah melainkan tes yang belum selesai - itu
    # membatalkan rilis tanpa memberi satu pun informasi.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cepat (beberapa detik) dan langsung relevan: yang diuji adalah jalur
      # pelaporan updater - bahwa pembaruan yang gagal dipasang BERBUNYI, dan
      # catatannya tidak terhapus saat aplikasi dibuka lagi.
      - name: Uji pelaporan updater
        run: npm run test:updater

      # Jalur pembaruan yang TIDAK lewat installer - satu-satunya yang sampai di
      # mesin dengan Smart App Control aktif. Yang diuji terutama penolakannya:
      # sha512 yang tidak cocok, manifes yang namanya aneh, isi yang tidak
      # lengkap, konten yang lebih tua dari aplikasinya. Semua berakhir sama
      # dari luar (aplikasi memakai bawaan paket), jadi tanpa tes tidak ada yang
      # bisa membedakan "ditolak dengan benar" dari "tidak pernah dicoba".
      - name: Uji pembaruan konten
        run: npm run test:konten

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pin OR-Tools dibaca dari fetch-python.js, bukan ditulis ulang di sini.
      # Dua sumber kebenaran untuk versi solver berarti suatu saat tes berjalan
      # di versi yang berbeda dari yang dikirim ke pengguna, dan bedanya tidak
      # akan berbunyi.
      - name: Pasang OR-Tools sesuai pin build
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(node -p "require('fs').readFileSync('electron/fetch-python.js','utf8').match(/ORTOOLS\s*=\s*'([^']+)'/)[1]")
          echo "pin dari fetch-python.js: $PIN"
          python -m pip install --quiet --disable-pip-version-check "$PIN"

      - name: Uji penjadwalan
        run: python -m unittest discover -s tests

  rilis:
    needs: tes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Python-nya BUKAN yang dibundel ke installer - yang dibundel diunduh
      # sendiri oleh fetch-python.js sebagai distribusi embeddable. Yang ini
      # cuma pemilik pip yang memasang OR-Tools ke dalamnya, dan wheel-nya
      # ditarget eksplisit (--python-version, --platform win_amd64), jadi versi
      # di sini tidak menentukan apa yang sampai ke pengguna.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Gagal di sini berarti gagal dalam hitungan detik, bukan setelah build
      # ~186 MB yang sia-sia. electron/ensure-tag.js sebenarnya memeriksa hal
      # yang sama, tapi pesannya menyebut "setel GH_TOKEN" - di CI yang benar
      # adalah menambah SECRET, dan tebakan yang salah di situ mahal.
      - name: Pastikan secret GH_TOKEN ada
        if: inputs.terbitkan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret GH_TOKEN belum ada di repo ini."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret,"
            echo "nama GH_TOKEN, isinya token dengan izin tulis ke padelin-rilis."
            exit 1
          fi

      - run: npm ci

      # icon.ico TIDAK ada di repo - ia di-gitignore sebagai artefak turunan,
      # sumber kebenarannya electron/build/icon.html yang ikut di-commit. Di
      # mesin sendiri berkasnya sudah lama ada sehingga tidak pernah terasa;
      # checkout bersih tidak punya apa-apa, dan electron-builder berhenti di
      # "cannot find specified resource" setelah Python 191 MB telanjur
      # diunduh. Dirender di sini, sebelum build, supaya gagalnya murah.
      #
      # make-icon.js memakai Edge/Chrome yang memang sudah terpasang di image
      # windows-latest; ia tidak menambah dependensi apa pun.
      - name: Render ikon dari icon.html
        run: npm run icon

      # Versi inilah yang jadi nama tag (vX.Y.Z) dan yang dibandingkan
      # electron-updater. Dicetak supaya log rilis menyebut apa yang dirilis,
      # bukan cuma bahwa sesuatu dirilis.
      - name: Sebutkan versi dan mode
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${{ inputs.terbitkan }}" = "true" ]; then
            echo "MERILIS v$V - tag, rilis, dan unggahan akan dibuat."
          else
            echo "UJI-KERING v$V - installer dibangun, tidak ada yang diterbitkan."
          fi

      # npm menjalankan "prerelease" (electron/ensure-tag.js, yang memastikan tag
      # DAN rilisnya sudah ada) lebih dulu dengan sendirinya, lalu "release"
      # (fetch-python + electron-builder --publish always).
      - name: Bangun dan terbitkan
        if: inputs.terbitkan
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release

      # Uji-kering: rantai yang sama persis sampai installer jadi, berhenti
      # sebelum apa pun keluar dari mesin ini. Tidak ada tag, tidak ada rilis,
      # tidak ada unggahan - dan tidak butuh secret sama sekali.
      #
      # Ini yang menangkap kelas kegagalan seperti icon.ico yang tidak ada di
      # repo: dulu ketahuannya hanya dengan menerbitkan sungguhan, dan gagalnya
      # baru muncul setelah Python 191 MB telanjur diunduh.
      #
      # verify-artifact.js tetap berjalan di jalur ini juga - ia dipasang sebagai
      # afterAllArtifactBuild, bukan sebagai bagian dari publish - jadi installer
      # yang isinya salah (mis. tanpa OR-Tools) tetap tertangkap di sini.
      - name: Bangun saja (uji-kering)
        if: ${{ !inputs.terbitkan }}
        run: npm run dist

      # Paket konten ikut dirakit di uji-kering. Ia dibuat PowerShell
      # (Compress-Archive) dan isinya ditentukan daftar di paket-konten.js, jadi
      # kegagalannya - folder yang berpindah, __pycache__ yang ikut terbawa -
      # tidak akan terlihat sampai ada yang benar-benar merakitnya.
      - name: Rakit paket konten (uji-kering)
        if: ${{ !inputs.terbitkan }}
        run: npm run paket:konten

      - name: Sebutkan artefak hasil uji-kering
        if: ${{ !inputs.terbitkan }}
        shell: bash
        run: |
          set -euo pipefail
          echo "isi dist-desktop:"
          ls -l dist-desktop | awk 'NR>1 {printf "  %-40s %10.1f MB\n", $9, $5/1048576}'
          # Installer wajib ada. Tanpa pemeriksaan ini, uji-kering yang gagal
          # menghasilkan installer tetap terbaca "hijau" - persis kegagalan yang
          # tidak berbunyi yang mau dihindari mode ini.
          ls dist-desktop/*.exe >/dev/null 2>&1 || {
            echo "Tidak ada installer di dist-desktop - buildnya tidak menghasilkan apa-apa."
            exit 1
          }

      # Rilis yang "sukses" tapi isinya tidak lengkap adalah kegagalan yang
      # tidak berbunyi - dan itu betul-betul terjadi di v1.1.7: dua publisher
      # electron-builder membuat DUA rilis untuk tag yang sama, installer dan
      # blockmap terpisah di rilis yang berbeda, exit code tetap 0. Penyebabnya
      # sudah ditutup di ensure-tag.js; pemeriksaan ini yang memastikan
      # penutupnya masih bekerja, dan menangkap bentuk lain dari kerusakan yang
      # sama kalau suatu saat muncul.
      - name: Periksa rilis yang terbit
        if: inputs.terbitkan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          REPO=$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")

          JML=$(gh api "repos/$REPO/releases" --jq "[.[] | select(.tag_name==\"$TAG\")] | length")
          echo "rilis dengan tag $TAG: $JML"
          if [ "$JML" != "1" ]; then
            echo "Harus tepat satu rilis untuk $TAG, ada $JML - kemungkinan rilis kembar."
            exit 1
          fi

          ASET=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name')
          echo "aset terunggah:"; echo "$ASET" | sed 's/^/  /'
          # konten.json dan zip-nya sama wajibnya dengan installer: tanpa
          # keduanya, mesin yang installer-nya diblokir Smart App Control tidak
          # punya jalur pembaruan sama sekali - dan diamnya tidak terlihat dari
          # mana pun, karena rilisnya tetap "berhasil".
          for wajib in "latest.yml" ".exe" ".exe.blockmap" "konten.json" "konten-$(node -p "require('./package.json').version").zip"; do
            echo "$ASET" | grep -q -- "$wajib" || {
              echo "Aset yang memuat '$wajib' tidak ada di rilis $TAG."
              echo "Tanpa latest.yml aplikasi terpasang tidak pernah melihat pembaruan;"
              echo "tanpa blockmap pembaruannya mundur ke unduhan utuh ~200 MB;"
              echo "tanpa konten.json + zip-nya, mesin dengan Smart App Control aktif"
              echo "tidak punya jalur pembaruan sama sekali."
              exit 1
            }
          done
          echo "Rilis $TAG lengkap."

      # Aset yang ADA belum berarti aset yang COCOK, dan ketidakcocokan di sini
      # adalah kegagalan terburuk yang bisa diterbitkan proyek ini: setiap
      # pengguna gagal memperbarui dengan galat checksum, serentak, dan tidak
      # bisa ditarik kembali tanpa rilis baru.
      #
      # Tidak ada yang memeriksanya sampai sekarang. verify-artifact.js memang
      # punya pemeriksaan ini, tapi ia dipasang sebagai afterAllArtifactBuild -
      # berjalan SEBELUM latest.yml ditulis - jadi di jalur rilis ia selalu
      # melewatkannya sendiri ("latest.yml dilewati - belum ditulis untuk build
      # ini"). Lubangnya baru ketahuan saat harus diperiksa dengan tangan.
      #
      # Yang di-hash adalah byte yang BENAR-BENAR disajikan GitHub, bukan berkas
      # lokal: unduhan yang terpotong menghasilkan aset yang ukurannya wajar di
      # daftar API tapi isinya bukan installer yang dibangun.
      - name: Periksa latest.yml cocok dengan installer yang terbit
        if: inputs.terbitkan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          REPO=$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")
          DASAR="https://github.com/$REPO/releases/download/$TAG"

          curl -sfL -o terbit-latest.yml "$DASAR/latest.yml"
          NAMA=$(node -p "require('fs').readFileSync('terbit-latest.yml','utf8').match(/^path:\s*(\S+)/m)[1]")
          echo "manifest menunjuk: $NAMA"
          curl -sfL -o terbit-installer.exe "$DASAR/$NAMA"

          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const yml = fs.readFileSync("terbit-latest.yml", "utf8");
            const isi = fs.readFileSync("terbit-installer.exe");
            const shaYml = yml.match(/^sha512:\s*(\S+)/m)[1];
            const ukuranYml = Number(yml.match(/^\s*size:\s*(\d+)/m)[1]);
            const sha = crypto.createHash("sha512").update(isi).digest("base64");
            const baris = (n, a, b) =>
              console.log(`  ${n.padEnd(22)} ${a === b ? "COCOK" : "TIDAK COCOK"}`);
            baris("ukuran", isi.length, ukuranYml);
            baris("sha512", sha, shaYml);
            if (isi.length !== ukuranYml || sha !== shaYml) {
              console.error(`\n  latest.yml menyebut ${ukuranYml} byte / ${shaYml}`);
              console.error(`  installer terbit  ${isi.length} byte / ${sha}`);
              console.error("\n  Auto-update akan menolak unduhan ini untuk SEMUA pengguna.");
              process.exit(1);
            }
            console.log("\n  Auto-update tidak akan menolak unduhan ini.");
          '
          rm -f terbit-latest.yml terbit-installer.exe

      # Alasan yang sama persis dengan pemeriksaan latest.yml di atas, untuk
      # jalur yang satunya: manifes yang tidak cocok dengan zip-nya membuat
      # SETIAP aplikasi menolak paket kontennya dengan galat checksum, serentak.
      - name: Periksa konten.json cocok dengan zip yang terbit
        if: inputs.terbitkan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          REPO=$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")
          DASAR="https://github.com/$REPO/releases/download/$TAG"

          curl -sfL -o terbit-konten.json "$DASAR/konten.json"
          NAMA=$(node -p "require('./terbit-konten.json').berkas")
          echo "manifes menunjuk: $NAMA"
          curl -sfL -o terbit-konten.zip "$DASAR/$NAMA"

          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("terbit-konten.json", "utf8"));
            const isi = fs.readFileSync("terbit-konten.zip");
            const sha = crypto.createHash("sha512").update(isi).digest("base64");
            console.log(`  ukuran  ${isi.length === m.ukuran ? "COCOK" : "TIDAK COCOK"}`);
            console.log(`  sha512  ${sha === m.sha512 ? "COCOK" : "TIDAK COCOK"}`);
            if (isi.length !== m.ukuran || sha !== m.sha512) {
              console.error("\n  Paket konten akan ditolak SEMUA aplikasi terpasang.");
              process.exit(1);
            }
            console.log(`\n  konten ${m.versi}, butuh aplikasi >= ${m.app_minimal}`);
          '
          rm -f terbit-konten.json terbit-konten.zip
